name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://mini_jira_test:ci-only-password@127.0.0.1:5432/mini_jira_test
      TEST_DATABASE_URL: postgresql+psycopg://mini_jira_test:ci-only-password@127.0.0.1:5432/mini_jira_test
      JWT_SECRET_KEY: ci-only-key-never-use-in-production
      RESEND_API_KEY: ci-only-no-network
      RESEND_FROM_EMAIL: noreply@example.org
      PASSWORD_RESET_FRONTEND_URL: https://frontend.example.com
      CORS_ORIGINS: '[]'
      REFRESH_COOKIE_SECURE: 'true'
      LOG_FORMAT: json
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mini_jira_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mini_jira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_jira_test -d mini_jira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.5'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: |
          uv python install 3.14
          uv sync --locked --group dev
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Check types
        run: uv run --no-sync basedpyright
      - name: Check migrations on a fresh database
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic current
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
      - name: Run all tests with PostgreSQL and coverage
        run: uv run --no-sync pytest --strict-markers --cov=mini_jira --cov-branch --cov-report=term-missing -ra
      - name: Check Dockerfile
        run: docker build --check .
      - name: Build Docker image
        run: docker build --tag mini-jira-api:ci .

  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Report published image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: %s:%s\nDigest: %s\nPull reference: %s@%s\n' \
            "$IMAGE" "$GITHUB_SHA" "$DIGEST" "$IMAGE" "$DIGEST" \
            | tee -a "$GITHUB_STEP_SUMMARY"
